[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mrnavax"
version = "0.20.0"
description = "Practical Python tools for the AI-leverage layers in mRNA cancer therapy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "rollroyces" }
]
keywords = [
  "mrna",
  "cancer-immunotherapy",
  "neoantigen",
  "codon-optimization",
  "lipid-nanoparticles",
  "clinical-trials",
  "biotechnology",
  "foundation-models",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []  # core: stdlib-only

[project.optional-dependencies]
llm = ["openai>=1.40"]
neoantigen-mhcflurry = ["mhcflurry>=2.0", "pandas<2.3"]
neoantigen-medcpt = ["torch>=2.0", "transformers>=4.40"]
protein-lm = ["torch>=2.0", "transformers>=4.40"]
spatial-r = []  # STModule ships as a subprocess; users install R/Seurat/STModule themselves per the upstream vignette
trial-medcpt = ["torch>=2.0", "transformers>=4.40"]
scrna = ["scanpy>=1.10", "anndata>=0.10", "numpy", "scipy"]
variant-alphagenome = ["alphagenome>=0.1"]  # AlphaGenome Atlas API client; non-commercial use only
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-static-i18n[material]>=1.2",
  "pymdown-extensions>=10.7",
]
all = ["openai>=1.40", "mhcflurry>=2.0", "pandas<2.3", "torch>=2.0", "transformers>=4.40", "scanpy>=1.10", "anndata>=0.10", "numpy", "scipy", "alphagenome>=0.1"]
dev = ["build>=1.0", "twine>=5.0", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/rollroyces/mrnavax"
Repository = "https://github.com/rollroyces/mrnavax.git"
Issues = "https://github.com/rollroyces/mrnavax/issues"
Changelog = "https://github.com/rollroyces/mrnavax/blob/main/CHANGELOG.md"

[project.scripts]
mrnavax = "mrnavax.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mrnavax"]

[tool.hatch.build.targets.sdist]
include = [
  "mrnavax",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "LICENSE-AGPL",
  "mkdocs.yml",
  "docs",
  "scripts",
  ".github",
  "pyproject.toml",
]

[tool.hatch.version]
path = "mrnavax/__init__.py"

# ---------- Linting (lightweight) ------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # we keep some long lines for readability

[tool.ruff.format]
quote-style = "double"
