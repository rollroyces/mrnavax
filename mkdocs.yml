site_name: mRNA × AI Toolkit
site_description: Practical Python tools for the AI-leverage layers in mRNA cancer therapy.
site_url: https://rollroyces.github.io/mrnavax/
repo_url: https://github.com/rollroyces/mrnavax
repo_name: rollroyces/mrnavax

theme:
  name: material
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-Hant
          name: 繁體中文
          build: true
          fixed_link: https://rollroyces.github.io/mrnavax/zh-Hant/
          theme:
            language: zh-Hant
          nav_translations:
            Home: 首頁
            Getting started: 快速開始
            Tools: 工具
            Backends: 後端
            Case studies: 案例研究
            API reference: API 參考
            Contributing: 貢獻指南
            Changelog: 更新日誌
            License: 授權
            codon: codon
            neoantigen: neoantigen
            trial: trial
            lnp: lnp
            scrna: scrna
            manufacture: manufacture
            spatial: spatial
        - locale: zh-Hans
          name: 简体中文
          build: true
          fixed_link: https://rollroyces.github.io/mrnavax/zh-Hans/
          theme:
            language: zh
          nav_translations:
            Home: 首页
            Getting started: 快速开始
            Tools: 工具
            Backends: 后端
            Case studies: 案例研究
            API reference: API 参考
            Contributing: 贡献指南
            Changelog: 更新日志
            License: 授权
            codon: codon
            neoantigen: neoantigen
            trial: trial
            lnp: lnp
            scrna: scrna
            manufacture: manufacture
            spatial: spatial

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tools:
      - codon: tools/codon.md
      - neoantigen: tools/neoantigen.md
      - trial: tools/trial.md
      - lnp: tools/lnp.md
      - scrna: tools/scrna.md
      - manufacture: tools/manufacture.md
      - spatial: tools/spatial.md
  - Backends: backends.md
  - Case studies:
      - Variant prioritization: case-studies/variant-prioritization.md
  - API reference: api.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - License: license.md
# Note: docs/contributing/considerations/ is NOT in nav — it's a
# historical record of features we spiked but intentionally didn't
# ship. See "Considered but not built" section in CONTRIBUTING for
# the index. Excluding from nav keeps the live page tree clean.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rollroyces/mrnavax
  generator: false
